<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go1 · avanti 50 cm</title>
<link rel="stylesheet" href="/ui/aidea.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: var(--space-8) var(--space-4) var(--space-10); display: flex; flex-direction: column; gap: var(--space-4); }
  main h1 { margin: 0; font-size: var(--fs-24); font-weight: 800; letter-spacing: -0.015em; text-transform: lowercase; }
  main p { margin: 0; color: var(--fg-2); font-size: var(--fs-14); }
  #out { padding: var(--space-3) var(--space-4); background: var(--bg-sunken); border: 1px solid var(--border); border-left: 3px solid var(--border-strong); white-space: pre-wrap; font-size: var(--fs-14); min-height: 4em; }
  #out.ok { border-left-color: var(--aidea-success); color: var(--aidea-success); }
  #out.err { border-left-color: var(--aidea-danger); color: var(--aidea-danger); }
  #cams { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #cams figure { margin: 0; }
  #cams img { width: 100%; background: #000; display: block; border: 1px solid var(--border); }
  #cams figcaption { margin-top: 4px; }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav__inner">
    <span class="topnav__brand"><img src="/ui/aidea-mark.svg" alt="aidea"><span class="topnav__brand-text">go1</span></span>
    <div class="topnav__status"></div>
    <span id="mode" class="badge badge--neutral">...</span>
  </div>
</header>
<main>
<h1>avanti di 50 cm</h1>
<p>Il bottone verifica che il cane risponda e poi lo fa camminare in avanti (0,2 m/s per 2,5 s, a circuito aperto: la distanza è approssimata).</p>
<button id="go" class="btn btn--lg btn--primary btn--block">controlla connessione e cammina 50 cm</button>
<button id="wasd" class="btn btn--lg btn--violet btn--block">attiva WASD</button>
<p id="keys" style="display:none">W/S avanti/indietro · A/D gira · spazio o Esc = stop. Rilasciando i tasti il cane si ferma.</p>
<button id="stop" class="btn btn--lg btn--danger btn--block">stop</button>
<div id="cams"></div>
<div id="out">Pronto.</div>
</main>
<script>
const out = document.getElementById('out'), go = document.getElementById('go');
const say = (t, cls) => { out.className = cls || ''; out.textContent = t; };

fetch('/api/mode').then(r => r.json()).then(m => {
  const el = document.getElementById('mode'); el.textContent = m.mode; el.className = 'badge ' + (m.mode === 'REAL' ? 'badge--danger' : 'badge--neutral');
  if (m.mode === 'REAL') {
    // Which 3 of the dog's 5 cameras: adjust CAMS after looking at the real frames.
    const CAMS = [1, 2, 4]; // cam3 black, cam5 unavailable (checked 4/11)
    const NAMES = {1: 'davanti', 2: 'basso', 4: 'lato'};
    document.getElementById('cams').innerHTML = CAMS.map(n =>
      '<figure><img src="/cam/' + n + '.mjpg" alt="cam' + n + '">' +
      '<figcaption class="eyebrow">cam' + n + ' ' + NAMES[n] + '</figcaption></figure>').join('');
  }
}).catch(() => say('Server locale non raggiungibile.', 'err'));

go.onclick = async () => {
  go.disabled = true;
  say('1/2 Controllo la connessione al cane...\n2/2 poi cammino.');
  try {
    const r = await fetch('/api/walk', { method: 'POST' });
    const j = await r.json();
    if (j.ok) {
      say('OK: connesso (batteria ' + (j.connect.soc ?? '?') + '%), camminato ' + j.elapsed_s + ' s.\n' + JSON.stringify(j.connect), 'ok');
    } else if (j.step === 'connect') {
      say('NON connesso: ' + j.error + '\nNessun comando inviato.', 'err');
    } else {
      say('Fallito (' + j.step + '): ' + (j.error || j.reason), 'err');
    }
  } catch (e) {
    say('Errore di rete verso il server locale: ' + e, 'err');
  }
  go.disabled = false;
};

const wasdBtn = document.getElementById('wasd'), keysHelp = document.getElementById('keys');
let ws = null, hb = null; const down = new Set();
const axes = () => ({
  fwd: (down.has('w') ? 1 : 0) - (down.has('s') ? 1 : 0),
  turn: (down.has('a') ? 1 : 0) - (down.has('d') ? 1 : 0),
});
const sendState = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(axes())); };
function wasdOff(msg) {
  clearInterval(hb); down.clear();
  if (ws) { try { ws.send(JSON.stringify({ fwd: 0, turn: 0 })); } catch (e) {} ws.close(); ws = null; }
  wasdBtn.textContent = 'attiva WASD'; keysHelp.style.display = 'none'; go.disabled = false;
  if (msg) say(msg, 'err');
}
wasdBtn.onclick = () => {
  if (ws) return wasdOff('WASD disattivato.');
  say('Connessione per WASD...'); go.disabled = true;
  ws = new WebSocket('ws://' + location.host + '/ws/teleop');
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'ready') {
      wasdBtn.textContent = 'disattiva WASD'; keysHelp.style.display = 'block';
      say('WASD attivo (batteria ' + (m.connect.soc ?? '?') + '%).', 'ok');
      hb = setInterval(sendState, 100);
    } else if (m.type === 'error') { ws = null; wasdOff(m.error); }
    else if (m.type === 'halted') { wasdOff('Fermato (STOP).'); }
  };
  ws.onclose = () => { if (ws) { ws = null; wasdOff('Connessione WASD chiusa.'); } };
};
addEventListener('keydown', e => {
  if (!ws) return;
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'escape') { e.preventDefault(); down.clear(); sendState(); return doStop(); }
  if ('wasd'.includes(k) && k.length === 1) { e.preventDefault(); if (!down.has(k)) { down.add(k); sendState(); } }
});
addEventListener('keyup', e => { if (down.delete(e.key.toLowerCase())) sendState(); });
addEventListener('blur', () => { down.clear(); sendState(); });

const doStop = () => fetch('/api/stop', { method: 'POST' }).then(() => say('STOP inviato.', 'err'));
document.getElementById('stop').onclick = doStop;
</script>
</body>
</html>
