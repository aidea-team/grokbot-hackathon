<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>g1 · aidea</title>
<link rel="stylesheet" href="/ui/aidea.css">
<style>
  .topnav__brand-text { font-weight: 700; }
  .seg { display: inline-flex; gap: var(--space-4); }
  .seg button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 2px 0; font: inherit; font-size: var(--fs-14); color: var(--fg-3); cursor: pointer; }
  .seg button:hover { color: var(--fg-2); }
  .seg button.on { color: var(--fg-1); font-weight: 600; border-bottom-color: var(--accent); }
  .seg button[hidden] { display: none; }
  [data-mode="real"] #m-real.on { border-bottom-color: var(--aidea-danger); }
  .topnav__actions { align-items: center; gap: var(--space-6); }
  .app { height: calc(100% - 65px); display: flex; gap: var(--space-6); padding: var(--space-4) var(--space-8); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .center { flex: 1; min-width: 0; gap: var(--space-3); }
  .views { flex: 1; min-height: 0; display: flex; gap: var(--space-3); }
  .view { position: relative; flex: 1; min-width: 0; background: var(--bg-sunken); display: flex; align-items: center; justify-content: center; }
  .view.head { flex: 0 0 38%; }
  .view img { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #cam { cursor: grab; }
  .tag { position: absolute; top: 6px; left: 8px; font-size: var(--fs-12); color: var(--fg-2); background: rgba(0,0,0,.55); padding: 2px 8px; }
  .nosig { position: absolute; color: var(--fg-3); font-size: var(--fs-14); text-align: center; padding: var(--space-4); }
  .htabs { position: absolute; bottom: 6px; right: 8px; background: rgba(0,0,0,.55); padding: 2px 8px; gap: var(--space-3); }
  .htabs button { font-size: 11px; }
  .pgrid { display: grid; grid-template-columns: 1fr auto auto auto; gap: 2px var(--space-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
  .pgrid b { color: var(--fg-3); font-weight: 400; }
  #pq { width: 100%; font-size: var(--fs-12); padding: 4px 8px; margin-top: 4px; }
  .side { width: 310px; flex: none; overflow-y: auto; gap: var(--space-4); }
  .side h3 { margin: 0 0 var(--space-2); font-size: var(--fs-12); color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
  .keys { display: grid; grid-template-columns: repeat(3, 50px); gap: 5px; }
  .key, .rkey { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--border-strong); font-weight: 600; cursor: pointer; background: var(--bg-raised); user-select: none; }
  .rkey { width: 50px; align-self: flex-start; }
  .key small, .rkey small { font-weight: 400; font-size: 9px; color: var(--fg-3); }
  .key.on { background: rgba(143, 63, 255, 0.35); border-color: var(--accent); }
  .keyrow { display: flex; gap: var(--space-5); flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: var(--space-3); font-size: var(--fs-14); }
  .row label { width: 78px; color: var(--fg-2); }
  .row input[type=range] { flex: 1; }
  .row output { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg-3); }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 1px var(--space-4); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
  .grid span:nth-child(odd) { color: var(--fg-3); }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; }
  .presets .btn { font-size: 11px; padding: 3px 8px; }
  .modeswitch { display: inline-flex; }
  .modeswitch .btn { border-radius: 0; }
  .modeswitch .btn + .btn { margin-left: -1px; }
  [data-mode="real"] #m-real { box-shadow: 0 0 0 1px var(--aidea-danger); }
  body[data-lo="1"] .simonly { display: none; }
  body[data-ctl="lab29"] .armsonly { display: none; }
  .banner { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; padding: var(--space-2) var(--space-4); border: 1px solid var(--aidea-danger); color: var(--aidea-danger); font-size: var(--fs-14); }
  .banner[hidden], #armpanel[hidden] { display: none; }
  #armpanel { padding: var(--space-3) var(--space-4); border: 1px solid var(--aidea-danger); font-size: var(--fs-14); }
  #armpanel label { display: flex; gap: var(--space-2); margin: 4px 0; cursor: pointer; }
  .chat { height: 34%; min-height: 150px; display: flex; flex-direction: column; border-top: 1px solid var(--border); padding-top: var(--space-2); }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: var(--fs-14); }
  .user { align-self: flex-end; max-width: 80%; background: rgba(143, 63, 255, 0.12); border: 1px solid rgba(143, 63, 255, 0.35); padding: 4px 10px; }
  .final { border-left: 3px solid var(--accent); padding-left: var(--space-3); }
  .err { color: var(--aidea-danger); }
  .step { display: grid; grid-template-columns: 80px 1fr; gap: var(--space-3); color: var(--fg-2); }
  .step img { width: 80px; height: 45px; object-fit: cover; background: var(--bg-sunken); }
  .step b { color: var(--fg-1); font-size: var(--fs-12); }
  .step.bad b { color: var(--aidea-danger); }
  #thinking { padding-top: var(--space-2); font-size: var(--fs-14); color: var(--fg-3); display: flex; align-items: center; gap: var(--space-2); }
  #thinking[hidden] { display: none; }
  #thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s infinite ease-in-out; }
  #thinking i:nth-child(2) { animation-delay: .18s; }
  #thinking i:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
  form { display: flex; gap: var(--space-2); padding-top: var(--space-2); }
  form input { flex: 1; font-size: var(--fs-14); padding: 8px 12px; }
  @media (max-width: 1000px) { .app { flex-direction: column; overflow: auto; } .views { flex-direction: column; min-height: 420px; } .view.head { flex: 1; } .side { width: auto; } }
</style>
</head>
<body data-mode="sim">
<header class="topnav">
  <div class="topnav__inner">
    <span class="topnav__brand"><img src="/ui/aidea-mark.svg" alt="aidea"><span class="topnav__brand-text">g1</span></span>
    <div class="topnav__actions">
      <span class="seg" aria-label="model"><button id="p-grok" class="on" title="Grok (xAI)" disabled>Grok</button></span>
      <select id="ctl" class="ui-select" aria-label="controller"></select>
      <div class="seg" role="group" aria-label="mode">
        <button id="m-sim" class="on">Simulator</button>
        <button id="m-real">Real</button>
      </div>
    </div>
  </div>
</header>
<div class="app">
  <div class="col center">
    <div id="banner" class="banner" hidden><strong>REAL G1</strong><span id="bantext" style="flex:1"></span><button id="kill" class="btn btn--sm btn--ghost">STOP (Esc)</button></div>
    <div id="armpanel" hidden>
      <strong>Before moving the real G1</strong>
      <label><input type="checkbox" class="chk"> The robot is standing in walking mode and an operator holds the remote.</label>
      <label><input type="checkbox" class="chk"> At least 2 m of free space, nobody close.</label>
      <label><input type="checkbox" class="chk"> Commands go to the real robot; Esc / Space / STOP halt it.</label>
      <div style="display:flex; gap:8px; margin-top:8px"><button id="arm" class="btn btn--sm btn--violet" disabled>Arm</button><button id="armcancel" class="btn btn--sm btn--ghost">Cancel</button></div>
    </div>
    <div class="views">
      <div class="view" id="mainview"><img id="cam" alt="3D view" draggable="false"><span class="tag" id="maintag">External view</span></div>
      <div class="view head"><img id="head" alt="head camera"><span class="tag" id="headtag">Head camera</span><div class="nosig" id="nosig" hidden></div>
        <div class="seg htabs" id="htabs"><button class="on" data-v="camera">Camera</button><button data-v="annotated">Objects</button><button data-v="depth">Depth</button></div></div>
    </div>
    <div class="chat">
      <div id="log"></div>
      <div id="thinking" hidden><i></i><i></i><i></i><span id="thinktext">thinking</span></div>
      <form id="form"><input id="msg" class="edit-input" placeholder="Talk to the G1 (e.g. “walk to the door and wave”)" autocomplete="off"><button class="btn btn--sm btn--violet">Send</button><button type="button" id="newchat" class="btn btn--sm btn--ghost">New chat</button><button type="button" id="abort" class="btn btn--sm btn--danger">Stop</button></form>
    </div>
  </div>
  <aside class="col side">
    <section id="psec" hidden>
      <h3>Perception</h3>
      <div class="row"><label for="pb">model</label><select id="pb" class="ui-select" style="flex:1"></select></div>
      <div class="row" id="prow"><label for="pp">every</label><input id="pp" type="range" min="2" max="15" step="1" value="3"><output id="ppo"></output></div>
      <input id="pq" class="edit-input" placeholder="desk, chair, computer monitor…">
      <div class="pgrid" id="pobj" style="margin-top:6px"></div>
      <div class="grid" style="margin-top:6px"><span>info</span><span id="pinfo"></span></div>
    </section>
    <section>
      <h3>Walk</h3>
      <div class="keyrow">
        <div class="keys">
          <div class="key" data-k="q">Q<small>left</small></div><div class="key" data-k="w">W<small>forward</small></div><div class="key" data-k="e">E<small>right</small></div>
          <div class="key" data-k="a">A<small>turn ←</small></div><div class="key" data-k="s">S<small>back</small></div><div class="key" data-k="d">D<small>turn →</small></div>
        </div>
        <div class="rkey" id="rkey">R<small>start</small></div>
        <div class="keys simonly armsonly">
          <div class="key" data-k="u">U<small>elbow +</small></div><div class="key" data-k="i">I<small>up</small></div><div class="key" data-k="o">O<small>elbow −</small></div>
          <div class="key" data-k="j">J<small>open</small></div><div class="key" data-k="k">K<small>down</small></div><div class="key" data-k="l">L<small>close</small></div>
        </div>
      </div>
    </section>
    <section class="simonly armsonly">
      <h3>Arm</h3>
      <div class="modeswitch" id="armsel"><button class="btn btn--sm btn--ghost" data-s="left">1 · left</button><button class="btn btn--sm btn--ghost" data-s="right">2 · right</button><button class="btn btn--sm btn--violet" data-s="both">3 · both</button></div>
    </section>
    <section>
      <h3>Speed</h3>
      <div class="row"><label for="sp">forward</label><input id="sp" type="range" min="0.1" max="1.0" step="0.05" value="0.4"><output id="spo"></output></div>
      <div class="row"><label for="tr">turn</label><input id="tr" type="range" min="0.2" max="1.0" step="0.05" value="0.6"><output id="tro"></output></div>
      <div class="row simonly armsonly"><label for="jr">arms</label><input id="jr" type="range" min="0.2" max="1" step="0.1" value="0.7"><output id="jro"></output></div>
    </section>
    <section class="armsonly">
      <h3>Gestures</h3>
      <div class="presets" id="presets"></div>
      <div id="customwrap" hidden>
        <h3 style="margin-top:10px">Taught</h3>
        <div class="presets" id="custom"></div>
        <button class="btn btn--sm btn--ghost" id="customstop" style="margin-top:6px">Stop taught action</button>
      </div>
    </section>
    <section>
      <h3>Robot mode</h3>
      <div style="display:flex; gap:6px; flex-wrap:wrap">
        <button class="btn btn--sm btn--ghost fsm" data-id="500">Start</button>
        <button class="btn btn--sm btn--ghost fsm" data-id="501">Walk 501</button>
        <button class="btn btn--sm btn--ghost fsm simonly" data-id="1">Damp</button>
        <button class="btn btn--sm btn--ghost fsm" data-id="3">Sit</button>
        <button class="btn btn--sm btn--ghost fsm" data-id="706">Squat / stand</button>
        <button class="btn btn--sm btn--ghost fsm simonly" data-id="702">Lie → stand</button>
        <button id="stop" class="btn btn--sm btn--ghost">Stop</button>
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px">
        <button class="btn btn--sm btn--ghost" id="hi">Raise</button>
        <button class="btn btn--sm btn--ghost" id="lowh">Lower</button>
        <button class="btn btn--sm btn--ghost bal" data-m="0">Balance 0</button>
        <button class="btn btn--sm btn--ghost bal" data-m="1">Balance 1</button>
      </div>
    </section>
    <section>
      <h3>State</h3>
      <div class="grid" id="st"></div>
    </section>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
const post = (u, b) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(b || {}) }).then(r => r.json()).then(d => { if (d && d.ok === false && d.error) note(d.error); return d; }).catch(() => ({}));
const held = new Set(); let shift = false, sel = "both", mode = "sim", lastErr = 0, loOnly = true;
function note(t) { const now = Date.now(); if (now - lastErr < 1500) return; lastErr = now; add("err", t); }
for (const [i, o] of [["sp", "spo"], ["tr", "tro"], ["jr", "jro"]]) { const e = $(i); try { e.value = localStorage.getItem("g1_" + i) || e.value; } catch {} const f = () => { $(o).textContent = (+e.value).toFixed(2); try { localStorage.setItem("g1_" + i, e.value); } catch {} }; e.oninput = f; f(); }

// ---------- views
let hview = "camera";  // what the head panel shows: camera | annotated (objects) | depth
const headSrc = () => (hview === "camera" ? "api/head.mjpg?" : `api/perception.mjpg?view=${hview}&`) + Date.now();
$("cam").src = "stream.mjpg"; $("head").src = headSrc();
function remount() { const t = Date.now(); $("cam").src = "stream.mjpg?" + t; $("head").src = headSrc(); }
$("head").onerror = () => setTimeout(() => $("head").src = headSrc(), 1500);

// ---------- live perception: segmentation + distance / height of what the head camera sees
function setHeadView(v) {
  hview = v;
  document.querySelectorAll("#htabs button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  $("headtag").textContent = { camera: "Head camera", annotated: "Objects (distance and height)", depth: "Depth" }[v];
  $("psec").hidden = v === "camera";
  $("head").src = headSrc();
  post("api/perception", { enabled: v !== "camera" }).then(showPerceptionCfg);
}
document.querySelectorAll("#htabs button").forEach((b) => b.onclick = () => setHeadView(b.dataset.v));
function showPerceptionCfg(s) {
  if (!s || !s.backends) return;
  const pb = $("pb");
  if (pb.options.length === 0) s.backends.forEach((b) => pb.add(new Option({ yoloe: "YOLOE · text, local (~3 fps)", yolo: "YOLO · COCO, local (~10 fps)", sam3: "SAM 3 · text, cloud (sampled)" }[b] || b, b)));
  pb.value = s.backend; $("pp").value = s.period_s; $("ppo").textContent = s.period_s + " s"; $("prow").hidden = s.backend !== "sam3";
  if (document.activeElement !== $("pq")) $("pq").value = s.prompts.join(", ");
}
$("pb").onchange = () => post("api/perception", { backend: $("pb").value }).then(showPerceptionCfg);
$("pp").oninput = () => { $("ppo").textContent = $("pp").value + " s"; };
$("pp").onchange = () => post("api/perception", { period_s: +$("pp").value }).then(showPerceptionCfg);
$("pq").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); post("api/perception", { prompts: $("pq").value.split(",") }).then(showPerceptionCfg); $("pq").blur(); } };
const fmtM = (v) => v == null ? "-" : v.toFixed(2) + " m";
async function ppoll() {
  try {
    const s = await (await fetch("api/perception")).json();
    showPerceptionCfg(s);
    if (s.enabled) {
      const head = ["object", "distance", "height", "bearing"].map((t) => { const b = document.createElement("b"); b.textContent = t; return b; });
      const cells = (s.objects || []).slice().sort((a, b) => (a.dist_m ?? 99) - (b.dist_m ?? 99)).flatMap((o) => {
        const dir = o.bearing_deg == null ? "-" : Math.abs(o.bearing_deg) < 3 ? "ahead" : `${Math.abs(o.bearing_deg).toFixed(0)}° ${o.bearing_deg > 0 ? "right" : "left"}`;
        return [o.label + (o.score != null ? ` ${o.score.toFixed(2)}` : ""), fmtM(o.dist_m), fmtM(o.top_m), dir].map((t) => { const e = document.createElement("span"); e.textContent = t; return e; });
      });
      $("pobj").replaceChildren(...head, ...cells);
      const t = s.timings || {}, f = s.floor;
      $("pinfo").textContent = s.error ? "error: " + s.error :
        `${s.backend}: ${t.seg_ms ?? "-"} ms` + (s.age_s != null ? ` · ${s.age_s} s old` : "") +
        ` · depth: ${s.depth_source || "none (RGB only)"}` + (f ? ` · camera ${f.height_m} m, pitch ${f.pitch_deg}° (${f.source === "sim" ? "exact" : "floor estimate"})` : " · floor not seen: no heights");
    }
  } catch {}
  setTimeout(ppoll, hview === "camera" ? 2000 : 600);
}
ppoll();
{ const v = new URLSearchParams(location.search).get("head"); if (v === "annotated" || v === "depth") setHeadView(v); }  // ?head=annotated: a dashboard that opens on the objects

// ---------- keyboard: walking, arms, gestures
const ARMKEYS = { i: ["shoulder_pitch", -1], k: ["shoulder_pitch", 1], j: ["shoulder_roll", 1], l: ["shoulder_roll", -1], u: ["elbow", 1], o: ["elbow", -1], y: ["shoulder_yaw", 1], h: ["shoulder_yaw", -1] };
const MIRROR = new Set(["shoulder_roll", "shoulder_yaw"]);
function walkCmd() {
  const k = (c) => held.has(c) ? 1 : 0, boost = shift ? 1.5 : 1, lin = +$("sp").value * boost, rot = +$("tr").value * boost;
  return { vx: (k("w") - k("s")) * lin, vy: (k("q") - k("e")) * Math.min(lin, 0.4), vyaw: (k("a") - k("d")) * rot };
}
function armRates() {
  if (loOnly) return {};  // locomotion-only (always on the real robot): no arm commands are ever sent
  const r = {}, g = +$("jr").value * (shift ? 1.5 : 1);
  for (const [key, [joint, dir]] of Object.entries(ARMKEYS)) if (held.has(key))
    for (const side of ["left", "right"]) {
      if (sel !== "both" && sel !== side) continue;
      const v = dir * (side === "right" && MIRROR.has(joint) ? -1 : 1) * g;
      r[side + "_" + joint] = (r[side + "_" + joint] || 0) + v;
    }
  return r;
}
let wasWalking = false, wasJog = false;
setInterval(() => {
  const c = walkCmd(), walking = !!(c.vx || c.vy || c.vyaw);
  if (walking) post("api/move", c); else if (wasWalking) post("api/stop");
  wasWalking = walking;
  const r = armRates(), jog = Object.keys(r).length > 0;
  if (jog) post("api/jog", { rates: r }); else if (wasJog) post("api/jog", { rates: {} });
  wasJog = jog;
}, 100);
const KEYS = "wasdqeijkluoyh";
function paint() { document.querySelectorAll(".key").forEach((e) => e.classList.toggle("on", held.has(e.dataset.k))); }
function stopAll() { held.clear(); paint(); post("api/stop"); }
function setSel(s) { sel = s; document.querySelectorAll("#armsel .btn").forEach((b) => b.className = "btn btn--sm " + (b.dataset.s === s ? "btn--violet" : "btn--ghost")); }
document.querySelectorAll("#armsel .btn").forEach((b) => b.onclick = () => setSel(b.dataset.s));
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range" && e.target.type !== "checkbox") { if (e.key === "Escape") stopAll(); return; }
  shift = e.shiftKey; const k = e.key.toLowerCase();
  if (k.length === 1 && KEYS.includes(k)) { held.add(k); paint(); e.preventDefault(); }
  else if (k === " " || k === "escape") { stopAll(); post("api/kill"); e.preventDefault(); }
  else if (k === "r") startRobot();
  else if (k === "1") setSel("left"); else if (k === "2") setSel("right"); else if (k === "3") setSel("both");
});
addEventListener("keyup", (e) => { shift = e.shiftKey; held.delete(e.key.toLowerCase()); paint(); });
addEventListener("blur", stopAll);
$("rkey").onclick = () => startRobot();
document.querySelectorAll(".key").forEach((el) => { const k = el.dataset.k; el.onpointerdown = () => { held.add(k); paint(); }; el.onpointerup = el.onpointerleave = el.onpointercancel = () => { held.delete(k); paint(); }; });
$("customstop").onclick = () => post("api/custom_stop");
$("stop").onclick = stopAll; $("kill").onclick = () => { stopAll(); post("api/kill"); };
async function setFsm(id) {
  const names = { 1: "Damp", 3: "Sit", 500: "Start", 501: "Walk mode", 702: "Lie → stand", 706: "Squat / stand" };
  if (mode === "real" && !confirm(`${names[id]} on the REAL robot (FSM ${id}). The robot changes mode. Operator ready with the remote, nobody close. Continue?`)) return;
  stopAll();
  const d = await post("api/fsm", { id });
  if (d && d.ok) add("", `FSM ${id} requested → robot reports FSM ${d.fsm ?? "?"} ${d.changed ? "(changed)" : "(NOT changed)"}`);
}
function startRobot() {  // LocoClient.Start() (FSM 500): on the REAL robot it changes its mode, so it goes through setFsm's confirmation
  setFsm(500);
}
document.querySelectorAll(".fsm").forEach((b) => b.onclick = () => setFsm(+b.dataset.id));
$("hi").onclick = () => { if (mode !== "real" || confirm("Raise the REAL robot. Continue?")) post("api/stand_height", { high: true }); };
$("lowh").onclick = () => { if (mode !== "real" || confirm("Lower the REAL robot. Continue?")) post("api/stand_height", { high: false }); };
document.querySelectorAll(".bal").forEach((b) => b.onclick = () => { if (mode !== "real" || confirm("Set balance mode on the REAL robot. Continue?")) post("api/balance_mode", { mode: +b.dataset.m }); });
let presetsMode = null;
async function loadPresets() {
  presetsMode = mode;
  const d = await (await fetch("api/presets")).json();
  const mk = (label, title, faded, onclick, cls) => { const b = document.createElement("button"); b.className = "btn btn--sm " + (cls || "btn--ghost"); b.textContent = label; if (title) b.title = title; if (faded) b.style.opacity = 0.45; b.onclick = onclick; return b; };
  $("presets").replaceChildren(...d.presets.map((p) => {
    const label = (p.release ? "↺ " : p.caution ? "⚠ " : "") + p.name.replaceAll("_", " ") + (p.id != null ? " · " + p.id : "");
    const faded = mode === "sim" && !p.simulated;
    const title = faded ? "not simulated" : p.release ? "release the arms" : p.caution ? "may make the robot fall" : "";
    return mk(label, title, faded, () => {
      if (mode === "real" && p.caution && !confirm(`“${p.name}” is not in the Unitree app and may make the robot fall. Clear space, remote in hand. Continue?`)) return;
      post("api/preset", { name: p.name });
    }, p.release ? "btn--violet" : "btn--ghost");
  }));
  $("custom").replaceChildren(...(d.custom || []).map((c) => mk(c.name.replace(/\n/g, " ") + (c.time ? " · " + c.time + " s" : ""),
    mode === "real" ? "" : "real robot only", mode !== "real", () => {
      if (!confirm(`Taught action “${c.name.replace(/\n/g, " ")}” on the REAL robot (${c.time || "?"} s). It may move the waist too. Clear space, remote in hand. Continue?`)) return;
      post("api/custom", { name: c.name });
    })));
  $("customwrap").hidden = !(d.custom && d.custom.length);
}
loadPresets();

// ---------- orbit camera (simulator)
let az = 145, el = -15, dist = 3, drag = null, orbitT = 0, orbitSynced = false;
const sendOrbit = () => { const t = Date.now(); if (t - orbitT > 50) { orbitT = t; post("api/orbit", { azimuth: az, elevation: el, distance: dist }); } };
$("cam").onpointerdown = (e) => { drag = [e.clientX, e.clientY]; $("cam").setPointerCapture(e.pointerId); };
$("cam").onpointerup = () => { drag = null; };
$("cam").onpointermove = (e) => { if (!drag) return; az -= (e.clientX - drag[0]) * 0.4; el = Math.max(-85, Math.min(0, el - (e.clientY - drag[1]) * 0.3)); drag = [e.clientX, e.clientY]; sendOrbit(); };
$("cam").onwheel = (e) => { e.preventDefault(); dist = Math.max(1, Math.min(10, dist * (e.deltaY > 0 ? 1.1 : 0.9))); sendOrbit(); };

// ---------- sim / real switch
function applyMode(s) {
  if (!s.mode) return; mode = s.mode; document.body.dataset.mode = mode;
  $("m-sim").classList.toggle("on", mode === "sim");
  $("m-real").classList.toggle("on", mode === "real");
  $("banner").hidden = mode !== "real";
  loOnly = !!s.locomotion_only; document.body.dataset.lo = loOnly ? "1" : "0";
  if (presetsMode !== null && presetsMode !== mode) loadPresets();
  document.body.dataset.ctl = mode === "sim" ? (s.controller || "gym12") : "real";
  const ctl = $("ctl"); ctl.hidden = mode !== "sim";
  if (s.controllers && ctl.options.length === 0) { for (const [k, v] of Object.entries(s.controllers)) ctl.add(new Option(v, k)); ctl.onchange = async () => { stopAll(); const d = await post("api/controller", { name: ctl.value }); if (d && d.ok) add("", "controller: " + ctl.value); }; }
  if (s.controller) ctl.value = s.controller;
  $("bantext").textContent = s.real_state === "armed" ? "armed: walking, modes and gestures go to the real robot" : s.real_state === "halted" ? "STOPPED by the kill switch: arm again from Real" : "not armed";
  $("maintag").textContent = mode === "real" ? "Robot camera" : "External view";
  $("cam").style.display = mode === "real" ? "none" : "block";
}
$("m-sim").onclick = async () => { const d = await post("api/mode", { mode: "sim" }); applyMode(d); $("log").replaceChildren(); remount(); };
$("m-real").onclick = () => { if (mode !== "real") $("armpanel").hidden = false; };
document.querySelectorAll(".chk").forEach((c) => c.onchange = () => $("arm").disabled = ![...document.querySelectorAll(".chk")].every((x) => x.checked));
$("armcancel").onclick = () => { $("armpanel").hidden = true; };
$("arm").onclick = async () => { const d = await post("api/mode", { mode: "real", confirm: true }); $("armpanel").hidden = true; applyMode(d); $("log").replaceChildren(); remount(); if (d.warning) add("err", d.warning); };

// ---------- state
async function poll() {
  try {
    const s = await (await fetch("api/state")).json(); applyMode(s);
    if (!orbitSynced && s.orbit) { [az, el, dist] = s.orbit; orbitSynced = true; }  // start dragging from the scene's own view
    const sig = s.camera_error; $("nosig").hidden = !sig; $("nosig").textContent = sig || "";
    const rows = [["x", s.x], ["y", s.y], ["yaw", s.yaw_deg], ["cmd vx", s.vx], ["cmd vy", s.vy], ["cmd ω", s.vyaw], ["action", s.preset || "-"], ["falls", s.falls], ["FSM", s.fsm ?? "-"]];
    $("st").replaceChildren(...rows.flatMap(([k, v]) => { const a = document.createElement("span"), b = document.createElement("span"); a.textContent = k; b.textContent = v ?? "-"; return [a, b]; }));
  } catch {}
  setTimeout(poll, 500);
}
poll();

// ---------- chat
const log = $("log"); let lastEv = 0, curSession = null, sentAt = 0;
function add(cls, text, extra) { const d = document.createElement("div"); d.className = cls; d.textContent = text; if (extra) d.append(extra); log.append(d); log.scrollTop = log.scrollHeight; return d; }
function fmtArgs(tool, a) {  // never "[object Object]": a move is shown as its steps
  if (tool === "move" && Array.isArray(a.steps))
    return a.steps.map((s) => `${String(s.action).replaceAll("_", " ")} ${s.amount}${String(s.action).startsWith("turn") ? "°" : " m"}`).join(" → ");
  return Object.entries(a).map(([k, v]) => k + "=" + (v !== null && typeof v === "object" ? JSON.stringify(v) : v)).join(", ");
}
function render(e) {
  if (e.kind === "user") add("user", e.text);
  else if (e.kind === "final") add("final", e.text);
  else if (e.kind === "error") add("err", e.text);
  else if (e.kind === "step") {
    const d = document.createElement("div"); d.className = "step" + (e.ok ? "" : " bad");
    const img = document.createElement("img"); img.src = `api/frame/${e.frame}.jpg`;
    const t = document.createElement("div"); const b = document.createElement("b");
    b.textContent = `${e.n}. ${e.tool}(${fmtArgs(e.tool, e.args)})${e.ok ? "" : " — REFUSED: " + e.result}`;
    t.append(b, document.createElement("br"), document.createTextNode(e.thought || "")); d.append(img, t); log.append(d); log.scrollTop = log.scrollHeight;
  }
}
// "thinking" under the chat while the agent is working (the phase comes from the server: start/vedo/penso = the model, cammino = walking, gesto = gesture)
const PHASE_LABEL = { cammino: "moving", gesto: "gesture" };
function applyThinking(d) {
  const busy = !!d.running || Date.now() - sentAt < 1500;  // the grace period covers the gap before the first poll answers
  $("thinking").hidden = !busy;
  if (busy) $("thinktext").textContent = PHASE_LABEL[d.phase] || "thinking";
}
async function evpoll() {
  try {
    const d = await (await fetch("api/events?after=" + lastEv)).json();
    if (curSession !== null && d.session !== curSession) { lastEv = 0; log.replaceChildren(); curSession = d.session; setTimeout(evpoll, 0); return; }  // webapp restarted
    curSession = d.session;
    for (const e of d.events) { render(e); lastEv = e.id; }
    applyThinking(d);
  } catch {}
  setTimeout(evpoll, 500);
}
evpoll();
$("form").onsubmit = async (e) => {
  e.preventDefault(); const text = $("msg").value.trim(); if (!text) return; $("msg").value = "";
  sentAt = Date.now(); applyThinking({ running: true });  // show it right away, do not wait for the next poll
  const d = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })
    .then((r) => r.json()).catch(() => ({ ok: false, error: "no response from the server" }));
  if (!d.ok) { sentAt = 0; $("thinking").hidden = true; add("user", text); add("err", d.error || "message not sent"); $("msg").value = text; }  // a refused message is never lost
};
$("abort").onclick = () => { stopAll(); sentAt = 0; $("thinking").hidden = true; post("api/abort"); };
$("newchat").onclick = async () => { stopAll(); sentAt = 0; $("thinking").hidden = true; const d = await post("api/chat_reset"); if (d && d.ok) log.replaceChildren(); };  // ids only grow, so lastEv stays valid
</script>
</body>
</html>
